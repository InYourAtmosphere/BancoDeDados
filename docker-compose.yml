version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: movielens_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: movielens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./relational/postgres_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  mongodb:
    image: mongo:7.0
    container_name: movielens_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
      MONGO_INITDB_DATABASE: movielens
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
    driver: local
  mongodata:
    driver: local
